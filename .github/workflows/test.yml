name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Generated KiCad parts must load and pass DRC in KiCad 9 (issues #22, #9).
  kicad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate KiCad projects
        run: |
          for f in coupler-10dB-ro4350b schiffman-ro4350b marchand-ro4350b; do
            node tools/kicad.mjs examples/$f.cir --out kicad-out/$f --board --date 2026-01-01
          done
      - name: kicad-cli (KiCad 9)
        run: docker run --rm -u root -v "$PWD:/w" -w /w kicad/kicad:9.0 bash tools/kicad-check.sh kicad-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-out
          path: kicad-out
