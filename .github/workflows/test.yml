name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Generated KiCad projects must load and pass DRC in KiCad (issues #22, #7, #9).
  # 9.0.8 is the target and gates merges; the newest KiCad 10 is checked too but only reports.
  kicad:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kicad: ['9.0.8', '10.0.7']
    continue-on-error: ${{ !startsWith(matrix.kicad, '9.') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate KiCad projects
        run: |
          for f in coupler-10dB-ro4350b schiffman-ro4350b marchand-ro4350b; do
            node tools/kicad.mjs examples/$f.cir --out kicad-out/$f --board --date 2026-01-01
          done
          # worked example 8: impedance-defined coupler → microstrip → board, as the layout panel does it
          node tools/kicad.mjs examples/coupler-10dB-microstrip.cir --make jlc-ro4350b-1.524 --out kicad-out/example8-1524 --board --date 2026-01-01
          # deliberately broken: coupler gap 0.06 mm, below JLC's 0.1 mm; KiCad's DRC must catch it
          sed 's/^\.param s = 0\.1025mm.*/.param s = 0.06mm/' examples/coupler-10dB-ro4350b.cir > /tmp/broken.cir
          grep -q '^.param s = 0.06mm' /tmp/broken.cir
          node tools/kicad.mjs /tmp/broken.cir --out kicad-out/broken-gap --board --date 2026-01-01 --force
      - name: KiCad ${{ matrix.kicad }}
        run: docker run --rm -u root -v "$PWD:/w" -w /w kicad/kicad:${{ matrix.kicad }} bash tools/kicad-check.sh kicad-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-out-${{ matrix.kicad }}
          path: kicad-out
