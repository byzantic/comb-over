name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Generated KiCad projects must load and pass DRC in KiCad (issues #22, #7, #9).
  # 9.0.8 is the target and gates merges; the newest KiCad 10 is checked too but only reports.
  kicad:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kicad: ['9.0.8', '10.0.7']
    continue-on-error: ${{ !startsWith(matrix.kicad, '9.') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate KiCad projects
        run: |
          for f in coupler-10dB-ro4350b coupler-15dB-ro4350b coupler-15dB-fingers-ro4350b coupler3-20dB-ro4350b coupler3-20dB-fingers-ro4350b schiffman-ro4350b marchand-ro4350b; do
            node tools/kicad.mjs examples/$f.cir --out kicad-out/$f --board --date 2026-01-01
          done
          # worked example 8: impedance-defined coupler → microstrip → board, as the layout panel does it
          node tools/kicad.mjs examples/coupler-10dB-microstrip.cir --make jlc-ro4350b-1.524 --out kicad-out/example8-1524 --board --date 2026-01-01
          # filter boards (#15): comb-line with 0603 capacitors, interdigital
          for f in combline-5pole-ro4350b interdigital-3pole-fr4; do
            node tools/kicad.mjs examples/$f.cir --out kicad-out/$f --board --date 2026-01-01
          done
          # worked example 9: specification → synthesised geometry → board (→ Gerbers in the KiCad step);
          # the synthesis must reproduce the committed example
          node tools/synth.mjs examples/combline-5pole-2g-ro4350b-1524.json --substrate jlc-ro4350b-1.524 --cap smd-0603 --out /tmp/example9.cir
          cmp /tmp/example9.cir examples/combline-5pole-2g-ro4350b-1524.cir || { echo "::error title=example9::synthesis no longer reproduces examples/combline-5pole-2g-ro4350b-1524.cir"; diff /tmp/example9.cir examples/combline-5pole-2g-ro4350b-1524.cir | head -40; exit 1; }
          node tools/kicad.mjs /tmp/example9.cir --out kicad-out/example9-comb --board --date 2026-01-01
          # worked example 10 (#38): hairpin and edge-coupled from one specification; both syntheses
          # are rerun (the hairpin takes about 1.5 min) and must reproduce their committed netlists
          for f in edgecoupled hairpin; do
            node tools/synth.mjs examples/$f-5pole-2g4-ro4350b-1524.json --substrate jlc-ro4350b-1.524 --out /tmp/example10-$f.cir
            cmp /tmp/example10-$f.cir examples/$f-5pole-2g4-ro4350b-1524.cir || { echo "::error title=example10::synthesis no longer reproduces examples/$f-5pole-2g4-ro4350b-1524.cir"; exit 1; }
          done
          for f in hairpin-5pole-2g4-ro4350b-1524 edgecoupled-5pole-2g4-ro4350b-1524; do
            node tools/kicad.mjs examples/$f.cir --out kicad-out/$f --board --date 2026-01-01
          done
          # worked example 11 (#40): duplexer of two interdigital filters; the synthesis is rerun
          # (about 1.5 min) and must reproduce the committed netlist
          node tools/synth.mjs examples/duplexer-2g30-2g53-ro4350b-1524.json --substrate jlc-ro4350b-1.524 --out /tmp/example11.cir
          cmp /tmp/example11.cir examples/duplexer-2g30-2g53-ro4350b-1524.cir || { echo "::error title=example11::synthesis no longer reproduces examples/duplexer-2g30-2g53-ro4350b-1524.cir"; exit 1; }
          node tools/kicad.mjs examples/duplexer-2g30-2g53-ro4350b-1524.cir --out kicad-out/duplexer-2g30-2g53 --board --date 2026-01-01
          # worked example 12 (#39, #47): compact Wilkinson and branch-line; the syntheses are rerun and must
          # reproduce the committed netlists (the Wilkinson board itself is trimmed against openEMS, which CI
          # does not run: tests/openems.mjs checks its committed full-wave result)
          node tools/divider.mjs examples/wilkinson-2g4-ro4350b-1524.json --substrate jlc-ro4350b-1.524 --out /tmp/ex12w.cir
          node tools/divider.mjs examples/branchline-2g4-ro4350b-1524.json --substrate jlc-ro4350b-1.524 --out /tmp/ex12b.cir
          cmp /tmp/ex12w.cir examples/wilkinson-2g4-ro4350b-1524-model.cir && cmp /tmp/ex12b.cir examples/branchline-2g4-ro4350b-1524.cir || { echo "::error title=example12::divider synthesis no longer reproduces the committed netlists"; exit 1; }
          for f in wilkinson-2g4-ro4350b-1524 branchline-2g4-ro4350b-1524; do
            node tools/kicad.mjs examples/$f.cir --out kicad-out/$f --board --date 2026-01-01
          done
          # loading-capacitor footprints (#14), library only
          node tools/kicad.mjs --caps jlc-ro4350b-0.508 --out kicad-out/caps-lib
          # deliberately broken 1: coupled-line gap 0.06 mm, below JLC's 0.1 mm. The gap is inside the
          # part, a net-tie footprint, where KiCad does not check clearance (verified on 9.0.8 and 10.0.7),
          # so comb-over's own DRC must refuse the export.
          sed 's/^\.param s = 0\.1025mm.*/.param s = 0.06mm/' examples/coupler-10dB-ro4350b.cir > /tmp/broken-gap.cir
          grep -q '^.param s = 0.06mm' /tmp/broken-gap.cir
          if node tools/kicad.mjs /tmp/broken-gap.cir --out /tmp/broken-gap --board; then echo "::error title=broken-gap::export of a sub-minimum gap was not refused"; exit 1; fi
          # deliberately broken 2: connectors on an 8 mm pitch, their 11.16 mm courtyards overlap. Exported
          # anyway; KiCad's DRC must catch it on the board.
          sed 's/^\.layout coupler K.*/.layout coupler K pitch=8mm/' examples/coupler-10dB-ro4350b.cir > /tmp/broken-pitch.cir
          node tools/kicad.mjs /tmp/broken-pitch.cir --out kicad-out/broken-pitch --board --date 2026-01-01 --force
      - name: KiCad ${{ matrix.kicad }}
        run: docker run --rm -u root -v "$PWD:/w" -w /w kicad/kicad:${{ matrix.kicad }} bash tools/kicad-check.sh kicad-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-out-${{ matrix.kicad }}
          path: kicad-out
